<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - Cross-Campus Task Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px; border-radius: 10px;">
        <h4 class="text-center fw-bold text-primary mb-3">学内連携タスクハブ</h4>
        <p class="text-center text-muted small mb-4">ログインして自分宛てのタスクを確認</p>
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert-danger py-2 small">ユーザー名またはパスワードが違います。</div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label small fw-bold">ユーザー名</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">パスワード</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold mt-2">ログイン</button>
        </form>
    </div>
</body>
</html>
